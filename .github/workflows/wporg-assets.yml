name: 'Update WordPress.org Assets'

# Reusable workflow: pushes a plugin's marketing assets (icon, banner, screenshots)
# to the WordPress.org SVN /assets/ directory. This is decoupled from releases —
# /assets lives outside /trunk and /tags, so refreshing an icon or banner does NOT
# require a version bump or a new tag. Uses raw svn commands (mirrors deploy.yml).
#
# The WordPress.org slug is read from the GravityOps Release Service by product_id,
# like deploy.yml; callers no longer repeat it.

on:
  workflow_call:
    inputs:
      product_id:
        description: 'Stable GravityOps product ID; its WordPress.org slug is read from the Release Service'
        required: true
        type: string
      assets_dir:
        description: 'Repo directory holding the wp.org assets.'
        required: false
        type: string
        default: '.wordpress-org'
      release_config_url:
        description: 'Authenticated release-configuration route'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/gravityops/v1/release-config'
    secrets:
      BLD_API_KEY:
        required: true
      WP_SVN_USERNAME:
        required: true
      WP_SVN_PASSWORD:
        required: true

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read WordPress.org slug from release configuration
        id: config
        env:
          CONFIG_URL: ${{ inputs.release_config_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PRODUCT_ID" =~ ^[a-z0-9_-]{1,64}$ ]]; then
            echo "::error::product_id '$PRODUCT_ID' is not a valid stable product ID."
            exit 1
          fi
          umask 077
          printf 'x-api-key: %s\n' "$API_KEY" > "$RUNNER_TEMP/release-config-headers"
          curl -sS --fail-with-body --max-time 30 -H "@$RUNNER_TEMP/release-config-headers" \
            "$CONFIG_URL/$PRODUCT_ID" -o "$RUNNER_TEMP/release-config.json"
          rm -f "$RUNNER_TEMP/release-config-headers"
          SLUG=$(jq -r --arg id "$PRODUCT_ID" --arg repo "$REPOSITORY" '
              select(.schema_version == 1 and .product_id == $id and .deploy_to_wordpress == true
                and (.repository | type == "string" and ascii_downcase == ($repo | ascii_downcase)))
              | [.variants[]? | select(.channel == "free") | .wporg_slug | select(type == "string" and test("^[a-z0-9][a-z0-9-]{0,99}$"))]
              | if length == 1 then .[0] else empty end
            ' "$RUNNER_TEMP/release-config.json")
          if [[ -z "$SLUG" ]]; then
            echo "::error::'$PRODUCT_ID' has no valid WordPress.org release configuration for this repository."
            exit 1
          fi
          echo "slug=$SLUG" | tee -a "$GITHUB_OUTPUT"

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Sync assets to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          ASSETS_DIR: ${{ inputs.assets_dir }}
          SLUG: ${{ steps.config.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$ASSETS_DIR" ]]; then
            echo "Assets directory '$ASSETS_DIR' not found; nothing to sync." >&2
            exit 1
          fi

          SVN_URL="https://plugins.svn.wordpress.org/$SLUG"
          echo "Syncing '$ASSETS_DIR' to $SVN_URL/assets"

          svn --version

          # Shallow checkout of the repo root, then fully fetch only the assets/ subtree.
          # (Avoids downloading /trunk and /tags, which can be large.)
          svn checkout --depth immediates "$SVN_URL" wporg
          cd wporg
          if svn info assets >/dev/null 2>&1; then
            svn update --set-depth infinity assets
          else
            # First-ever assets dir for this plugin (e.g. a plugin that never had a banner).
            mkdir -p assets
          fi

          # Mirror the repo's assets dir into SVN assets/, deleting anything removed.
          rsync -rc --delete \
            --exclude ".git" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude "**/.git" \
            "../$ASSETS_DIR"/ assets/

          svn cleanup . || true

          # Track new files recursively.
          svn add --force assets --auto-props --parents

          # WordPress.org serves each file by its svn:mime-type. Without it, browsers
          # download images instead of displaying them. --auto-props is unreliable on
          # CI runners, so set the MIME type explicitly on every tracked asset.
          find assets -type f -iname '*.png'  -exec svn propset svn:mime-type image/png     {} + || true
          find assets -type f -iname '*.jpg'  -exec svn propset svn:mime-type image/jpeg    {} + || true
          find assets -type f -iname '*.jpeg' -exec svn propset svn:mime-type image/jpeg    {} + || true
          find assets -type f -iname '*.gif'  -exec svn propset svn:mime-type image/gif     {} + || true
          find assets -type f -iname '*.svg'  -exec svn propset svn:mime-type image/svg+xml {} + || true

          # Remove missing files safely; substring parsing avoids status-column bugs.
          while IFS= read -r missing_path; do
            [[ -z "$missing_path" ]] && continue
            svn rm --force "${missing_path}@"
          done < <(svn status | awk 'substr($0,1,1)=="!" {print substr($0,9)}')

          # Clear stale lock entries before committing.
          while IFS= read -r locked_path; do
            [[ -z "$locked_path" ]] && continue
            svn cleanup "${locked_path}" || true
          done < <(svn status | awk '(substr($0,1,1)=="L" || substr($0,3,1)=="L") {print substr($0,9)}')

          svn status

          if [[ -z "$(svn status)" ]]; then
            echo "No asset changes to commit."
          else
            attempts=0
            until [ $attempts -ge 3 ]; do
              if svn commit --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache -m "Update WordPress.org assets"; then
                echo "SVN assets commit succeeded."
                break
              fi
              attempts=$((attempts + 1))
              if [ $attempts -ge 3 ]; then
                echo "SVN commit failed after 3 attempts." >&2
                exit 1
              fi
              echo "Commit failed, retrying in 20s... ($attempts/3)"
              sleep 20
              svn cleanup . || true
              svn update
            done
          fi
