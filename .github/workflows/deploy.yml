name: 'Deploy'

# Builds the release artifact and ships it to Freemius and WordPress.org. It no
# longer checks anything.
#
# Quality gating — PHPCS, each plugin's test suite, and Plugin Check — moved to
# scripts/preflight.sh, which tag-plugins.sh runs BEFORE it commits and tags. The
# check was worth little here and cost a lot: it fired on the pushed tag, so a
# failure left the tag already on origin with the release half-done, and it could
# only ever run Plugin Check, never PHPCS or the tests, because CI works inside a
# single plugin's checkout and cannot read the scripts/ or root repos. Strauss writes
# its prefixed output into vendor/, which the check excludes, so it never saw
# anything the local run does not.
#
# The suite-wide exclude_files / exclude_directories / ignore_codes inputs went with
# it; those lists now live only in scripts/pcp-check.sh, which ends the requirement
# to keep two copies in step. Per-plugin pcp.json still works and is still merged
# there. No caller ever passed the three inputs, so removing them breaks nothing.
#
# Renamed from pcp-check.yml. Callers reference a reusable workflow by path, so this
# file and the 15 caller workflows have to be pushed together — a tag pushed while
# only one side has landed resolves to a workflow that is not there.

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: 'The slug of the plugin on WordPress.org and Freemius'
        required: true
        type: string
      plugin_id:
        description: 'Freemius plugin ID'
        required: false
        type: string
      deploy_to_wp:
        description: 'Whether to deploy to WordPress.org or not'
        type: boolean
        required: true
      deploy_to_freemius:
        description: 'Whether to deploy to Freemius or not'
        type: boolean
        required: false
        default: true
      fail_on_duplicate:
        description: 'Whether to fail on duplicate plugin versions'
        type: boolean
        required: false
        default: true
      overwrite:
        description: 'Whether to overwrite existing plugin versions'
        type: boolean
        required: false
        default: false
      zip_files:
        description: 'Files and directories to include in the zip'
        type: string
        required: false
      version:
        description: 'Version to deploy (optional, overrides tag)'
        required: false
        type: string
      update_feed_item_key:
        description: 'The key for the update feed item'
        required: true
        type: string
      docs_sync_url:
        description: 'URL to sync documentation'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/bld/v1/sync-docs'
      release_notify_url:
        description: 'URL that turns release milestones into a Slack DM'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/bld/v1/release-notify'

    secrets:
      BLD_API_KEY:
        required: true
      UPDATE_FEED_URL:
        required: true
      FREEMIUS_PUBLIC_KEY:
        required: false
      DEV_ID:
        required: false
      FREEMIUS_SECRET_KEY:
        required: false
      WP_SVN_USERNAME:
        required: false
      WP_SVN_PASSWORD:
        required: false
      SSH_PRIVATE_KEY_GRAVITYOPS_CORE:
        required: true

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "Using manual input version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag run. Skipping."
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [get_version]
    if: ${{ needs.get_version.outputs.version && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    # Surfaced so the notify job can report Freemius and WP.org independently
    # rather than collapsing both into one job result.
    outputs:
      freemius: ${{ steps.freemius_deploy.outcome }}
      wporg: ${{ steps.wporg_deploy.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

      - name: Install Production Dependencies
        run: |
          composer config repositories.gravityops-local --unset
          composer config minimum-stability stable
          composer config prefer-stable true
          CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
          composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup Vendor
        run: |
          find vendor -type f -name "*.sh" -delete
          rm -f vendor/trustedlogin/client/bin/build-sass
          rm -f vendor/bin/build-sass

      # See the pcp job: Strauss reads any github-oauth token via Composer's Factory; clear it
      # since prefixing needs no GitHub auth (gravityops/core is SSH/no-api, the rest are public).
      - name: Clear Composer github-oauth token
        run: composer config --global --unset github-oauth.github.com || true

      - name: Prefix namespaces (Strauss)
        run: |
          mkdir -p bin
          # Pin to a specific version known to ship a phar — Strauss releases have not always
          # included the phar asset, so tracking `latest` can break deploys. Bump deliberately.
          # curl -fSL https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar -o bin/strauss.phar
          curl -fSL https://github.com/BrianHenryIE/strauss/releases/download/0.29.1/strauss.phar -o bin/strauss.phar
          php bin/strauss.phar
          rm -rf bin
          composer dump-autoload

      - name: Create Zip
        if: ${{ inputs.deploy_to_freemius }}
        run: |
          mkdir -p build
          zip -r build/plugin.zip ${{ inputs.zip_files }}

      - name: Deploy to Freemius
        if: ${{ inputs.deploy_to_freemius }}
        id: freemius_deploy
        uses: eitan-brightleaf/freemius-deploy@main
        with:
          file_name: build/plugin.zip
          release_mode: 'released'
          add_contributor: 'true'
          fail_on_duplicate: '${{ inputs.fail_on_duplicate }}'
          overwrite: '${{ inputs.overwrite }}'
          download_premium: 'false'
          download_free: ${{ inputs.deploy_to_wp }}
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_ID: ${{ inputs.plugin_id }}

      # always() so a failed upload still reports; the job still aborts afterwards
      # because the steps below carry no such condition. continue-on-error keeps a
      # Slack outage from turning a good release red.
      - name: Notify Slack — Freemius
        if: ${{ always() && inputs.deploy_to_freemius && steps.freemius_deploy.outcome != 'skipped' }}
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ inputs.release_notify_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}
          STATUS: ${{ steps.freemius_deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg plugin_slug "$PLUGIN_SLUG" \
            --arg version "$VERSION" \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            '{plugin_slug: $plugin_slug, version: $version, stage: "freemius", status: $status, run_url: $run_url}' \
          | curl -sS -X POST "$NOTIFY_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              --data @-

      - name: Prepare Plugin Directory for WP.org
        if: ${{ inputs.deploy_to_wp }}
        run: |
          mkdir plugin-dir
          if [ "${{ inputs.deploy_to_freemius }}" = "true" ]; then
            unzip ${{ steps.freemius_deploy.outputs.free_version }} -d plugin-dir
            if [ -d "plugin-dir/${{ inputs.plugin_slug }}" ]; then
              mv "plugin-dir/${{ inputs.plugin_slug }}"/* plugin-dir/
              rm -rf "plugin-dir/${{ inputs.plugin_slug }}"
            fi
          else
            # Local build logic using zip_files
            # We use a temp zip to respect the zip_files patterns and wildcards accurately.
            # build/ is only created by the Create Zip step, which is skipped on this path.
            mkdir -p build
            zip -r build/local-plugin.zip ${{ inputs.zip_files }}
            unzip build/local-plugin.zip -d plugin-dir
          fi

      - name: Modify Plugin Name for Lite version
        if: ${{ inputs.deploy_to_freemius && inputs.deploy_to_wp }}
        run: |
          # Find the main PHP file by searching for "Plugin Name:"
          MAIN_FILE=$(grep -l "Plugin Name:" plugin-dir/*.php | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            sed -i "s/Plugin Name: \(.*\)/Plugin Name: \1 - Lite/" "$MAIN_FILE"
            echo "Updated Plugin Name in $MAIN_FILE"
          fi

          # Append " - Lite" to the name in readme.txt
          if [ -f "plugin-dir/readme.txt" ]; then
            sed -i "1s/=== \(.*\) ===/=== \1 - Lite ===/" "plugin-dir/readme.txt"
            echo "Updated Plugin Name in readme.txt"
          fi

      - name: Install Subversion
        if: ${{ inputs.deploy_to_wp }}
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Deploy to WordPress.org SVN
        id: wporg_deploy
        if: ${{ inputs.deploy_to_wp }}
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          BUILD_DIR: plugin-dir
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$BUILD_DIR" ]]; then
            echo "Build directory '$BUILD_DIR' not found." >&2
            exit 1
          fi

          SVN_URL="https://plugins.svn.wordpress.org/$SLUG"
          echo "Deploying version $VERSION to $SVN_URL"

          # Defensive cleanup in case any packaged files include SVN metadata.
          find "$BUILD_DIR" -type d -name ".svn" -prune -exec rm -rf {} +

          svn --version
          svn checkout "$SVN_URL" wporg

          rsync -rc --delete \
            --exclude ".git" \
            --exclude ".gitignore" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude "**/.git" \
            "$BUILD_DIR"/ wporg/trunk/

          cd wporg
          svn cleanup . || true
          svn update

          # Add all new files and directories recursively.
          svn add --force trunk --auto-props --parents

          # Remove missing files safely; using substring parsing avoids status-column bugs.
          while IFS= read -r missing_path; do
            [[ -z "$missing_path" ]] && continue
            svn rm --force "${missing_path}@"
          done < <(svn status | awk 'substr($0,1,1)=="!" {print substr($0,9)}')

          # Clear stale lock entries before committing.
          while IFS= read -r locked_path; do
            [[ -z "$locked_path" ]] && continue
            svn cleanup "${locked_path}" || true
          done < <(svn status | awk '(substr($0,1,1)=="L" || substr($0,3,1)=="L") {print substr($0,9)}')

          svn status

          if [[ -z "$(svn status)" ]]; then
            echo "No SVN changes to commit."
          else
            attempts=0
            until [ $attempts -ge 3 ]; do
              if svn commit --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache -m "Release $VERSION"; then
                echo "SVN trunk commit succeeded."
                break
              fi
              attempts=$((attempts + 1))
              if [ $attempts -ge 3 ]; then
                echo "SVN commit failed after 3 attempts." >&2
                exit 1
              fi
              echo "Commit failed, retrying in 20s... ($attempts/3)"
              sleep 20
              svn cleanup . || true
              svn update
            done
          fi

          TAG_URL="$SVN_URL/tags/$VERSION"
          if svn ls "$TAG_URL" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping tag creation."
          else
            svn copy "$SVN_URL/trunk" "$TAG_URL" \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache \
              -m "Tagging $VERSION"
            echo "Tagged $VERSION"
          fi

      - name: Notify Slack — WordPress.org
        if: ${{ always() && inputs.deploy_to_wp && steps.wporg_deploy.outcome != 'skipped' }}
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ inputs.release_notify_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}
          STATUS: ${{ steps.wporg_deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg plugin_slug "$PLUGIN_SLUG" \
            --arg version "$VERSION" \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            '{plugin_slug: $plugin_slug, version: $version, stage: "wporg", status: $status, run_url: $run_url}' \
          | curl -sS -X POST "$NOTIFY_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              --data @-

      - name: Notify Update Feed
        run: |
          VERSION="${{ needs.get_version.outputs.version }}"
          CHANGELOG=$(sed -n "/= $VERSION.*=/,/= /p" readme.txt | sed '1d;$d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '\n' ' ' | sed 's/"/\\"/g')
          curl -X POST ${{ secrets.UPDATE_FEED_URL }} \
            -H "X-API-Key: ${{ secrets.BLD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
            \"item_updated\": \"${{ inputs.update_feed_item_key }}\",
            \"version\": \"$VERSION\",
            \"changelog\": \"$CHANGELOG\"
          }"

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Sync Documentation
        run: |
          if [ -d "docs" ]; then
            echo "Processing documentation for ${{ inputs.plugin_slug }}..."
            # Convert Markdown to HTML fragments
            # Use gfm, --wrap=none and strip trailing spaces to avoid unintended line breaks
            find docs -name "*.md" -exec sh -c 'sed "s/[[:space:]]*$//" "$1" | pandoc -f gfm -t html --wrap=none -o "$1.html"' _ {} \;
            # Zip and POST
            zip -r docs.zip docs/
            curl -X POST "${{ inputs.docs_sync_url }}" \
              -H "x-api-key: ${{ secrets.BLD_API_KEY }}" \
              -F "plugin_slug=${{ inputs.plugin_slug }}" \
              -F "docs_zip=@docs.zip"
          else
            echo "No docs/ directory found. Skipping documentation sync."
          fi

  # Fires whether or not deploy ran. Quality gating moved to scripts/preflight.sh,
  # which runs before the tag exists, so there is no longer a check job that can fail
  # here — a run with no version is simply not a release and has nothing to report.
  notify:
    needs: [get_version, deploy]
    if: ${{ always() && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack — run complete
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ inputs.release_notify_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          FREEMIUS_RESULT: ${{ needs.deploy.outputs.freemius }}
          WPORG_RESULT: ${{ needs.deploy.outputs.wporg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Stages a run never reached come back empty; drop them so the summary
          # lists what actually happened instead of a column of question marks.
          # The overall verdict is derived from these server-side.
          jq -n \
            --arg plugin_slug "$PLUGIN_SLUG" \
            --arg version "$VERSION" \
            --arg run_url "$RUN_URL" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg freemius "$FREEMIUS_RESULT" \
            --arg wporg "$WPORG_RESULT" \
            '{
               plugin_slug: $plugin_slug,
               version: $version,
               stage: "run",
               run_url: $run_url,
               stages: ({freemius: $freemius, wporg: $wporg, deploy: $deploy}
                        | with_entries(select(.value != "")))
             }' \
          | curl -sS -X POST "$NOTIFY_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              --data @-
