name: 'Deploy'

# Builds the release artifact and ships it to Freemius and WordPress.org. It no
# longer checks anything.
#
# Quality gating — PHPCS, each plugin's test suite, and Plugin Check — moved to
# scripts/preflight.sh, which tag-plugins.sh runs BEFORE it commits and tags. The
# check was worth little here and cost a lot: it fired on the pushed tag, so a
# failure left the tag already on origin with the release half-done, and it could
# only ever run Plugin Check, never PHPCS or the tests, because CI works inside a
# single plugin's checkout and cannot read the scripts/ or root repos. Strauss writes
# its prefixed output into vendor/, which the check excludes, so it never saw
# anything the local run does not.
#
# The suite-wide exclude_files / exclude_directories / ignore_codes inputs went with
# it; those lists now live only in scripts/pcp-check.sh, which ends the requirement
# to keep two copies in step. Per-plugin pcp.json still works and is still merged
# there. No caller ever passed the three inputs, so removing them breaks nothing.
#
# Renamed from pcp-check.yml. Callers reference a reusable workflow by path, so this
# file and the 15 caller workflows have to be pushed together — a tag pushed while
# only one side has landed resolves to a workflow that is not there.
#
# Product routing comes from the GravityOps Release Service. A caller passes only its
# product_id; the release_config job reads that product's authenticated release
# configuration and derives the distribution slug, Freemius product, channels,
# WordPress.org slug and docs choice. The response is validated, including that it
# belongs to the calling repository, before anything is built or published.

on:
  workflow_call:
    inputs:
      product_id:
        description: 'Stable GravityOps product ID; all release routing is read from the Release Service'
        required: true
        type: string
      fail_on_duplicate:
        description: 'Whether to fail on duplicate plugin versions'
        type: boolean
        required: false
        default: true
      overwrite:
        description: 'Whether to overwrite existing plugin versions'
        type: boolean
        required: false
        default: false
      zip_files:
        description: 'Files and directories to include in the zip'
        type: string
        required: false
      version:
        description: 'Version to deploy (optional, overrides tag)'
        required: false
        type: string
      release_config_url:
        description: 'Authenticated release-configuration route'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/gravityops/v1/release-config'
      release_api_url:
        description: 'Authenticated route that records a release'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/gravityops/v1/releases'
      docs_sync_url:
        description: 'URL to sync documentation'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/gravityops/v1/docs/sync'
      release_notify_url:
        description: 'URL that turns release milestones into Slack messages'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/gravityops/v1/notifications/release'

    secrets:
      BLD_API_KEY:
        required: true
      FREEMIUS_PUBLIC_KEY:
        required: false
      DEV_ID:
        required: false
      FREEMIUS_SECRET_KEY:
        required: false
      WP_SVN_USERNAME:
        required: false
      WP_SVN_PASSWORD:
        required: false
      SSH_PRIVATE_KEY_GRAVITYOPS_CORE:
        required: true

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "Using manual input version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag run. Skipping."
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release_config:
    needs: [get_version]
    if: ${{ needs.get_version.outputs.version && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      distribution_slug: ${{ steps.config.outputs.distribution_slug }}
      freemius_product_id: ${{ steps.config.outputs.freemius_product_id }}
      deploy_to_freemius: ${{ steps.config.outputs.deploy_to_freemius }}
      deploy_to_wp: ${{ steps.config.outputs.deploy_to_wp }}
      wporg_slug: ${{ steps.config.outputs.wporg_slug }}
      sync_documentation: ${{ steps.config.outputs.sync_documentation }}
    steps:
      - name: Read and validate release configuration
        id: config
        env:
          CONFIG_URL: ${{ inputs.release_config_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PRODUCT_ID" =~ ^[a-z0-9_-]{1,64}$ ]]; then
            echo "::error::product_id '$PRODUCT_ID' is not a valid stable product ID."
            exit 1
          fi
          # The key goes through a header file, never the command line.
          umask 077
          printf 'x-api-key: %s\n' "$API_KEY" > "$RUNNER_TEMP/release-config-headers"
          curl -sS --fail-with-body --max-time 30 -H "@$RUNNER_TEMP/release-config-headers" \
            "$CONFIG_URL/$PRODUCT_ID" -o "$RUNNER_TEMP/release-config.json"
          rm -f "$RUNNER_TEMP/release-config-headers"

          # Validate the whole record before using any field. The repository must be
          # the calling one, so a misconfigured product_id cannot publish another product.
          if ! jq -e --arg id "$PRODUCT_ID" --arg repo "$REPOSITORY" '
              . as $c
              | ($c.schema_version == 1)
              and ($c.revision | type == "string" and test("^[0-9a-f]{64}$"))
              and ($c.product_id == $id)
              and ($c.repository | type == "string" and ascii_downcase == ($repo | ascii_downcase))
              and ($c.distribution_slug | type == "string" and test("^[a-z0-9][a-z0-9-]{0,99}$"))
              and ($c.deploy_to_freemius | type == "boolean")
              and ($c.deploy_to_wordpress | type == "boolean")
              and ($c.sync_documentation | type == "boolean")
              and (($c.freemius_product_id // "") | type == "string")
              and (if $c.deploy_to_freemius then (($c.freemius_product_id // "") | test("^[0-9]{1,10}$")) else true end)
              and ($c.variants | type == "array" and length > 0)
              and all($c.variants[]; (.channel == "free" or .channel == "premium")
                    and (.plugin_file | type == "string" and test("^[a-z0-9][a-z0-9_-]*/[A-Za-z0-9_.-]+\\.php$"))
                    and (.wporg_slug | type == "string"))
              and ([ $c.variants[] | select(.channel == "free" and (.wporg_slug | test("^[a-z0-9][a-z0-9-]{0,99}$"))) ] | length) == (if $c.deploy_to_wordpress then 1 else 0 end)
              and ($c.deploy_to_freemius or $c.deploy_to_wordpress)
            ' "$RUNNER_TEMP/release-config.json" >/dev/null; then
            echo "::error::Release configuration for '$PRODUCT_ID' is invalid or belongs to another repository."
            exit 1
          fi

          jq -r '
            "distribution_slug=\(.distribution_slug)",
            "freemius_product_id=\(.freemius_product_id // "")",
            "deploy_to_freemius=\(.deploy_to_freemius)",
            "deploy_to_wp=\(.deploy_to_wordpress)",
            "wporg_slug=\([.variants[] | select(.channel == "free") | .wporg_slug][0] // "")",
            "sync_documentation=\(.sync_documentation)"
          ' "$RUNNER_TEMP/release-config.json" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: [get_version, release_config]
    if: ${{ needs.get_version.outputs.version && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    # Surfaced so the notify job can report Freemius and WP.org independently
    # rather than collapsing both into one job result.
    outputs:
      freemius: ${{ steps.freemius_deploy.outcome }}
      wporg: ${{ steps.wporg_deploy.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

      - name: Install Production Dependencies
        run: |
          composer config repositories.gravityops-local --unset
          composer config minimum-stability stable
          composer config prefer-stable true
          CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
          composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup Vendor
        run: |
          find vendor -type f -name "*.sh" -delete
          rm -f vendor/trustedlogin/client/bin/build-sass
          rm -f vendor/bin/build-sass

      # See the pcp job: Strauss reads any github-oauth token via Composer's Factory; clear it
      # since prefixing needs no GitHub auth (gravityops/core is SSH/no-api, the rest are public).
      - name: Clear Composer github-oauth token
        run: composer config --global --unset github-oauth.github.com || true

      - name: Prefix namespaces (Strauss)
        run: |
          mkdir -p bin
          # Pin to a specific version known to ship a phar — Strauss releases have not always
          # included the phar asset, so tracking `latest` can break deploys. Bump deliberately.
          # curl -fSL https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar -o bin/strauss.phar
          curl -fSL https://github.com/BrianHenryIE/strauss/releases/download/0.31.1/strauss.phar -o bin/strauss.phar
          php bin/strauss.phar
          rm -rf bin
          composer dump-autoload

      - name: Create Zip
        if: ${{ needs.release_config.outputs.deploy_to_freemius == 'true' }}
        run: |
          mkdir -p build
          zip -r build/plugin.zip ${{ inputs.zip_files }}

      - name: Deploy to Freemius
        if: ${{ needs.release_config.outputs.deploy_to_freemius == 'true' }}
        id: freemius_deploy
        uses: eitan-brightleaf/freemius-deploy@main
        with:
          file_name: build/plugin.zip
          release_mode: 'released'
          add_contributor: 'true'
          fail_on_duplicate: '${{ inputs.fail_on_duplicate }}'
          overwrite: '${{ inputs.overwrite }}'
          download_premium: 'false'
          download_free: ${{ needs.release_config.outputs.deploy_to_wp }}
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: ${{ needs.release_config.outputs.distribution_slug }}
          PLUGIN_ID: ${{ needs.release_config.outputs.freemius_product_id }}

      # always() so a failed upload still reports; the job still aborts afterwards
      # because the steps below carry no such condition. continue-on-error keeps a
      # Slack outage from turning a good release red.
      - name: Notify Slack — Freemius
        if: ${{ always() && needs.release_config.outputs.deploy_to_freemius == 'true' && steps.freemius_deploy.outcome != 'skipped' }}
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ inputs.release_notify_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
          VERSION: ${{ needs.get_version.outputs.version }}
          STATUS: ${{ steps.freemius_deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg product_id "$PRODUCT_ID" \
            --arg version "$VERSION" \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            '{product_id: $product_id, version: $version, stage: "freemius", status: $status, run_url: $run_url}' \
          | curl -sS -X POST "$NOTIFY_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              --data @-

      - name: Prepare Plugin Directory for WP.org
        if: ${{ needs.release_config.outputs.deploy_to_wp == 'true' }}
        run: |
          mkdir plugin-dir
          if [ "${{ needs.release_config.outputs.deploy_to_freemius }}" = "true" ]; then
            unzip ${{ steps.freemius_deploy.outputs.free_version }} -d plugin-dir
            if [ -d "plugin-dir/${{ needs.release_config.outputs.distribution_slug }}" ]; then
              mv "plugin-dir/${{ needs.release_config.outputs.distribution_slug }}"/* plugin-dir/
              rm -rf "plugin-dir/${{ needs.release_config.outputs.distribution_slug }}"
            fi
          else
            # Local build logic using zip_files
            # We use a temp zip to respect the zip_files patterns and wildcards accurately.
            # build/ is only created by the Create Zip step, which is skipped on this path.
            mkdir -p build
            zip -r build/local-plugin.zip ${{ inputs.zip_files }}
            unzip build/local-plugin.zip -d plugin-dir
          fi

      - name: Modify Plugin Name for Lite version
        if: ${{ needs.release_config.outputs.deploy_to_freemius == 'true' && needs.release_config.outputs.deploy_to_wp == 'true' }}
        run: |
          # Find the main PHP file by searching for "Plugin Name:"
          MAIN_FILE=$(grep -l "Plugin Name:" plugin-dir/*.php | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            sed -i "s/Plugin Name: \(.*\)/Plugin Name: \1 - Lite/" "$MAIN_FILE"
            echo "Updated Plugin Name in $MAIN_FILE"
          fi

          # Append " - Lite" to the name in readme.txt
          if [ -f "plugin-dir/readme.txt" ]; then
            sed -i "1s/=== \(.*\) ===/=== \1 - Lite ===/" "plugin-dir/readme.txt"
            echo "Updated Plugin Name in readme.txt"
          fi

      - name: Install Subversion
        if: ${{ needs.release_config.outputs.deploy_to_wp == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Deploy to WordPress.org SVN
        id: wporg_deploy
        if: ${{ needs.release_config.outputs.deploy_to_wp == 'true' }}
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          BUILD_DIR: plugin-dir
          SLUG: ${{ needs.release_config.outputs.wporg_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$BUILD_DIR" ]]; then
            echo "Build directory '$BUILD_DIR' not found." >&2
            exit 1
          fi

          SVN_URL="https://plugins.svn.wordpress.org/$SLUG"
          echo "Deploying version $VERSION to $SVN_URL"

          # Defensive cleanup in case any packaged files include SVN metadata.
          find "$BUILD_DIR" -type d -name ".svn" -prune -exec rm -rf {} +

          svn --version
          svn checkout "$SVN_URL" wporg

          rsync -rc --delete \
            --exclude ".git" \
            --exclude ".gitignore" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude "**/.git" \
            "$BUILD_DIR"/ wporg/trunk/

          cd wporg
          svn cleanup . || true
          svn update

          # Add all new files and directories recursively.
          svn add --force trunk --auto-props --parents

          # Remove missing files safely; using substring parsing avoids status-column bugs.
          while IFS= read -r missing_path; do
            [[ -z "$missing_path" ]] && continue
            svn rm --force "${missing_path}@"
          done < <(svn status | awk 'substr($0,1,1)=="!" {print substr($0,9)}')

          # Clear stale lock entries before committing.
          while IFS= read -r locked_path; do
            [[ -z "$locked_path" ]] && continue
            svn cleanup "${locked_path}" || true
          done < <(svn status | awk '(substr($0,1,1)=="L" || substr($0,3,1)=="L") {print substr($0,9)}')

          svn status

          if [[ -z "$(svn status)" ]]; then
            echo "No SVN changes to commit."
          else
            attempts=0
            until [ $attempts -ge 3 ]; do
              if svn commit --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache -m "Release $VERSION"; then
                echo "SVN trunk commit succeeded."
                break
              fi
              attempts=$((attempts + 1))
              if [ $attempts -ge 3 ]; then
                echo "SVN commit failed after 3 attempts." >&2
                exit 1
              fi
              echo "Commit failed, retrying in 20s... ($attempts/3)"
              sleep 20
              svn cleanup . || true
              svn update
            done
          fi

          TAG_URL="$SVN_URL/tags/$VERSION"
          if svn ls "$TAG_URL" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping tag creation."
          else
            svn copy "$SVN_URL/trunk" "$TAG_URL" \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache \
              -m "Tagging $VERSION"
            echo "Tagged $VERSION"
          fi

      - name: Notify Slack — WordPress.org
        if: ${{ always() && needs.release_config.outputs.deploy_to_wp == 'true' && steps.wporg_deploy.outcome != 'skipped' }}
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ inputs.release_notify_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
          VERSION: ${{ needs.get_version.outputs.version }}
          STATUS: ${{ steps.wporg_deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg product_id "$PRODUCT_ID" \
            --arg version "$VERSION" \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            '{product_id: $product_id, version: $version, stage: "wporg", status: $status, run_url: $run_url}' \
          | curl -sS -X POST "$NOTIFY_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              --data @-

      # Docs sync runs before the release is recorded. Syncing creates a new plugin's
      # docs category, and the changelog page that hangs off it; recording projects the
      # changelog onto that page. The other way round, a plugin's first release silently
      # lost its changelog entry (GOAIF 1.0.0). Both calls now fail the step on an HTTP
      # error; the Release Service queues a projection it cannot make yet (202).
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Sync Documentation
        if: ${{ needs.release_config.outputs.sync_documentation == 'true' }}
        env:
          DOCS_SYNC_URL: ${{ inputs.docs_sync_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "docs" ]; then
            echo "No docs/ directory found. Skipping documentation sync."
            exit 0
          fi
          echo "Processing documentation for $PRODUCT_ID..."
          # Convert Markdown to HTML fragments
          # Use gfm, --wrap=none and strip trailing spaces to avoid unintended line breaks
          find docs -name "*.md" -exec sh -c 'sed "s/[[:space:]]*$//" "$1" | pandoc -f gfm -t html --wrap=none -o "$1.html"' _ {} \;
          # Zip and POST; a rejected sync fails the release so the docs gap is visible.
          zip -r docs.zip docs/
          umask 077
          printf 'x-api-key: %s\n' "$API_KEY" > "$RUNNER_TEMP/docs-headers"
          curl -sS --fail-with-body -X POST "$DOCS_SYNC_URL" \
            -H "@$RUNNER_TEMP/docs-headers" \
            -F "product_id=$PRODUCT_ID" \
            -F "docs_zip=@docs.zip"
          rm -f "$RUNNER_TEMP/docs-headers"

      - name: Record Release
        env:
          RELEASE_API_URL: ${{ inputs.release_api_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
          VERSION: ${{ needs.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # This exact version's entry inside == Changelog ==, through EOF when it is
          # the only entry, joined to one line as the release projection expects.
          CHANGELOG=''
          if [ -f readme.txt ]; then
            CHANGELOG=$(awk -v v="$VERSION" '
              { sub(/\r$/, "") }
              /^== Changelog ==[[:space:]]*$/ { in_changelog = 1; next }
              /^==/ { if (in_changelog) exit }
              in_changelog && /^= / {
                if (found) exit
                if ($2 == v) { found = 1; next }
              }
              found { print }
            ' readme.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d' | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          fi
          if [ -z "$CHANGELOG" ]; then
            echo "::warning::No changelog entry for $VERSION in readme.txt; recording the release without one."
          fi
          umask 077
          printf 'x-api-key: %s\n' "$API_KEY" > "$RUNNER_TEMP/release-headers"
          jq -n \
            --arg product_id "$PRODUCT_ID" \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{product_id: $product_id, version: $version, released_at: $released_at, changelog: $changelog, include_in_recent_updates: true}' \
          | curl -sS --fail-with-body -X POST "$RELEASE_API_URL" \
              -H "@$RUNNER_TEMP/release-headers" \
              -H "Content-Type: application/json" \
              --data @-
          rm -f "$RUNNER_TEMP/release-headers"

  # Fires whether or not deploy ran. Quality gating moved to scripts/preflight.sh,
  # which runs before the tag exists, so there is no longer a check job that can fail
  # here — a run with no version is simply not a release and has nothing to report.
  notify:
    needs: [get_version, release_config, deploy]
    if: ${{ always() && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      # Read the same commit that was deployed. A checkout failure must not stop
      # the status notification from reporting the release outcome.
      - name: Checkout release changelog
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Notify Slack — run complete
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ inputs.release_notify_url }}
          API_KEY: ${{ secrets.BLD_API_KEY }}
          PRODUCT_ID: ${{ inputs.product_id }}
          VERSION: ${{ needs.get_version.outputs.version }}
          # A release whose configuration could not be read never starts deploy; report
          # that as a failed deploy rather than a skipped one.
          DEPLOY_RESULT: ${{ needs.release_config.result == 'failure' && 'failure' || needs.deploy.result }}
          FREEMIUS_RESULT: ${{ needs.deploy.outputs.freemius }}
          WPORG_RESULT: ${{ needs.deploy.outputs.wporg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CHANGELOG=''
          if [ -f readme.txt ]; then
            # Match this exact version inside Changelog, preserving bullet lines
            # through EOF when this is the plugin's only release entry.
            CHANGELOG=$(awk -v v="$VERSION" '
              { sub(/\r$/, "") }
              /^== Changelog ==[[:space:]]*$/ { in_changelog = 1; next }
              /^==/ { if (in_changelog) exit }
              in_changelog && /^= / {
                if (found) exit
                if ($2 == v) { found = 1; next }
              }
              found { print }
            ' readme.txt)
          fi
          if [ -z "$CHANGELOG" ]; then
            echo '::warning::Release changelog unavailable; sending status without it.'
          fi

          # Stages a run never reached come back empty; drop them so the summary
          # lists what actually happened instead of a column of question marks.
          # The overall verdict is derived from these server-side.
          jq -n \
            --arg product_id "$PRODUCT_ID" \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg run_url "$RUN_URL" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg freemius "$FREEMIUS_RESULT" \
            --arg wporg "$WPORG_RESULT" \
            '{
               product_id: $product_id,
               version: $version,
               changelog: $changelog,
               stage: "run",
               run_url: $run_url,
               stages: ({freemius: $freemius, wporg: $wporg, deploy: $deploy}
                        | with_entries(select(.value != "")))
             }' \
          | curl -sS -X POST "$NOTIFY_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              --data @-
