name: Purge Old Update Feed Entries

# Retired. The GravityOps Release Service filters recent updates by timestamp and its
# daily projection reconciler replaces this weekly purge. The schedule is removed;
# the file stays, runnable by hand, until production verification ends the legacy
# /bld/v1/purge_old_entries route (spec Phase 11).
on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call Purge Endpoint
        run: |
          curl -X POST https://brightleafdigital.io/wp-json/bld/v1/purge_old_entries \
            -H "X-API-Key: ${{ secrets.BLD_API_KEY }}"
