name: Purge Old Update Feed Entries

on:
  schedule:
    # Runs at 00:00 on Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call Purge Endpoint
        run: |
          curl -X POST https://brightleafdigital.io/wp-json/bld/v1/purge_old_entries \
            -H "X-API-Key: ${{ secrets.BLD_API_KEY }}"