name: Check Plugin with PCP
on:
  workflow_call:
    inputs:
        exclude_files:
            description: 'Files to exclude from the check'
            type: string
            required: false
            default: |
              .gitignore
              .wp-env.json
        ignore_codes:
            description: 'Ignore codes for the check'
            type: string
            required: false
            default: 'WordPress.DateTime.RestrictedFunctions.date_date'
        plugin_slug:
            description: 'The slug of the plugin on WordPress.org and Freemius'
            required: true
            type: string
        plugin_id:
            description: 'Freemius plugin ID'
            required: true
            type: string
        deploy_to_wp:
            description: 'Wether to deploy to WordPress.org or not'
            type: boolean
            required: true
        fail_on_duplicate:
            description: 'Whether to fail on duplicate plugin versions'
            type: boolean
            required: false
            default: true
        overwrite:
            description: 'Whether to overwrite existing plugin versions'
            type: boolean
            required: false
            default: false
        zip_files:
            description: 'Files and directories to include in the zip'
            type: string
            required: false
            default: 'includes vendor *.php *.txt'
        version:
          description: 'Version to deploy (optional, overrides tag)'
          required: false
          type: string

        update_feed_item_key:
          description: 'The key for the update feed item'
          required: true
          type: string

    secrets:
      BLD_API_KEY:
        required: true
      UPDATE_FEED_URL:
        required: true
      FREEMIUS_PUBLIC_KEY:
        required: true   
      DEV_ID:
        required: true        
      FREEMIUS_SECRET_KEY:
        required: true        
      WP_SVN_USERNAME:
        required: false    
      WP_SVN_PASSWORD:
        required: false
      SSH_PRIVATE_KEY_GRAVITYOPS_CORE:
        required: true
jobs:
    pcp:
        runs-on: ubuntu-latest
        steps:
            # Checkout the repository
            - name: Checkout
              uses: actions/checkout@v4

            # Setup PHP
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer

            - name: Setup SSH Agent
              uses: webfactory/ssh-agent@v0.8.0
              with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

            # Clean up config and resolve correct tag dynamically
            - name: Install Production Dependencies
              run: |
                composer config repositories.gravityops-local --unset
                composer config minimum-stability stable
                composer config prefer-stable true
                CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
                composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

            - name: Prefix namespaces (Strauss)
              run: composer run-script prefix-namespaces

            # Run PCP check
            - name: PCP
              uses: wordpress/plugin-check-action@v1
              with:
                  exclude-files: ${{ inputs.exclude_files }}
                  ignore-codes: ${{ inputs.ignore_codes }}

    get_version:
        needs: pcp
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get_version.outputs.version }}
        steps:
            - name: Get version from tag or input
              id: get_version
              run: |
                  # Prefer manual input if provided
                  INPUT_VERSION="${{ inputs.version }}"
                  if [ -n "$INPUT_VERSION" ]; then
                    VERSION="${INPUT_VERSION#v}"
                    echo "Using manual input version: $VERSION"
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # If the workflow is running on a tag, this is the tag name (e.g. v1.3.8)
                  if [ "${{ github.ref_type }}" != "tag" ]; then
                    echo "Not a tag run. Skipping."
                    exit 0
                  fi

                  TAG="${{ github.ref_name }}"
                  VERSION="${TAG#v}"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    maybe_deploy:
        needs: get_version
        if: ${{ needs.get_version.outputs.version && needs.get_version.outputs.version != '' }}
        uses: BrightLeaf-Digital/.github/.github/workflows/deploy-plugin.yml@main
        with:
          plugin_slug: ${{ inputs.plugin_slug }}
          plugin_id: ${{ inputs.plugin_id }}
          deploy_to_wp: ${{ inputs.deploy_to_wp }}
          fail_on_duplicate: ${{ inputs.fail_on_duplicate }}
          overwrite: ${{ inputs.overwrite }}
          version: ${{ needs.get_version.outputs.version }}
          zip_files: ${{ inputs.zip_files }}
          update_feed_item_key: ${{ inputs.update_feed_item_key }}
        secrets:
          BLD_API_KEY: ${{ secrets.BLD_API_KEY }}
          UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL }}
          FREEMIUS_PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.DEV_ID }}
          FREEMIUS_SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          WP_SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          WP_SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          SSH_PRIVATE_KEY_GRAVITYOPS_CORE: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}
