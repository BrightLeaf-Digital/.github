name: 'PCP Check and Deploy'

on:
  workflow_call:
    inputs:
      # These three are the SUITE-WIDE defaults, and the same lists live in
      # scripts/pcp-check.sh so a local run and a CI run agree — change them together.
      # Anything a single plugin needs on top belongs in that plugin's own pcp.json,
      # which the "Resolve PCP config" step below merges into these. Passing one of
      # these inputs from a caller REPLACES the list rather than adding to it, which is
      # how kanban silently lost date_date, so prefer pcp.json.
      exclude_files:
        description: 'Files to exclude from the check (suite-wide; per-plugin additions go in pcp.json)'
        type: string
        required: false
        # .phpunit.result.cache is a local, gitignored artifact; it is listed so a local
        # run and a CI run resolve to the same set.
        default: |
          .gitignore
          .wp-env.json
          .phpunit.result.cache
      exclude_directories:
        description: 'Directories to exclude from the check (suite-wide; per-plugin additions go in pcp.json)'
        type: string
        required: false
        # Plugin Check's own defaults are replaced when this is passed, so .git/vendor/
        # node_modules have to be repeated here. tests/ never ships (see zip_files), so
        # linting it only produces noise about stubs and fixtures. .github never ships
        # either, and PCP flags its presence.
        default: |
          .git
          vendor
          node_modules
          tests
          .github
      ignore_codes:
        description: 'Ignore codes for the check (suite-wide; per-plugin additions go in pcp.json)'
        type: string
        required: false
        # DisallowShortOpenTag.EchoFound: `<?= ?>` is the suite's preferred style for simple
        # inline output (see AGENTS.md) and is always available since PHP 5.4 regardless of
        # the short_open_tag ini setting, so the sniff is a WPCS style preference we opt out of.
        default: |
          WordPress.DateTime.RestrictedFunctions.date_date
          Generic.PHP.DisallowShortOpenTag.EchoFound
      plugin_slug:
        description: 'The slug of the plugin on WordPress.org and Freemius'
        required: true
        type: string
      plugin_id:
        description: 'Freemius plugin ID'
        required: false
        type: string
      deploy_to_wp:
        description: 'Whether to deploy to WordPress.org or not'
        type: boolean
        required: true
      deploy_to_freemius:
        description: 'Whether to deploy to Freemius or not'
        type: boolean
        required: false
        default: true
      fail_on_duplicate:
        description: 'Whether to fail on duplicate plugin versions'
        type: boolean
        required: false
        default: true
      overwrite:
        description: 'Whether to overwrite existing plugin versions'
        type: boolean
        required: false
        default: false
      zip_files:
        description: 'Files and directories to include in the zip'
        type: string
        required: false
      version:
        description: 'Version to deploy (optional, overrides tag)'
        required: false
        type: string
      update_feed_item_key:
        description: 'The key for the update feed item'
        required: true
        type: string
      docs_sync_url:
        description: 'URL to sync documentation'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/bld/v1/sync-docs'

    secrets:
      BLD_API_KEY:
        required: true
      UPDATE_FEED_URL:
        required: true
      FREEMIUS_PUBLIC_KEY:
        required: false
      DEV_ID:
        required: false
      FREEMIUS_SECRET_KEY:
        required: false
      WP_SVN_USERNAME:
        required: false
      WP_SVN_PASSWORD:
        required: false
      SSH_PRIVATE_KEY_GRAVITYOPS_CORE:
        required: true

jobs:
  pcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

      - name: Install Production Dependencies
        run: |
          composer config repositories.gravityops-local --unset
          composer config minimum-stability stable
          composer config prefer-stable true
          CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
          composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup Vendor
        run: |
          find vendor -type f -name "*.sh" -delete
          rm -f vendor/trustedlogin/client/bin/build-sass
          rm -f vendor/bin/build-sass

      # Prefixing only reads the already-installed composer.json/vendor and needs no GitHub
      # auth, so clear any (possibly invalid) github-oauth token to keep Composer/Strauss from
      # rejecting it. Safe because gravityops/core is fetched over SSH (no-api) and the rest are public.
      - name: Clear Composer github-oauth token
        run: composer config --global --unset github-oauth.github.com || true

      - name: Prefix namespaces (Strauss)
        run: |
          mkdir -p bin
          # Pin to a specific version known to ship a phar — Strauss releases have not always
          # included the phar asset, so tracking `latest` can break deploys. Bump deliberately.
          # curl -fSL https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar -o bin/strauss.phar
          curl -fSL https://github.com/BrianHenryIE/strauss/releases/download/0.29.1/strauss.phar -o bin/strauss.phar
          php bin/strauss.phar
          rm -rf bin
          composer dump-autoload

      # Per-plugin PCP config, merged into the suite-wide defaults above rather than
      # replacing them. The plugin's own repo is the only place both this workflow and
      # scripts/pcp-check.sh can read, since a reusable workflow runs inside the
      # caller's checkout and cannot see the scripts repo.
      - name: Resolve PCP config
        id: pcp_config
        env:
          DEFAULT_IGNORE_CODES: ${{ inputs.ignore_codes }}
          DEFAULT_EXCLUDE_DIRECTORIES: ${{ inputs.exclude_directories }}
          DEFAULT_EXCLUDE_FILES: ${{ inputs.exclude_files }}
        shell: bash
        run: |
          set -euo pipefail

          # Values reach the action newline-separated, but callers have historically
          # passed comma-separated strings too, so both are accepted on the way in and
          # normalized to newlines on the way out.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          FIELDS = ("ignore_codes", "exclude_directories", "exclude_files")
          CONFIG_FILE = "pcp.json"

          resolved = {}
          for field in FIELDS:
              raw = os.environ.get(f"DEFAULT_{field.upper()}", "")
              values = []
              for chunk in raw.replace(",", "\n").splitlines():
                  chunk = chunk.strip()
                  if chunk and chunk not in values:
                      values.append(chunk)
              resolved[field] = values

          if os.path.isfile(CONFIG_FILE):
              try:
                  with open(CONFIG_FILE, encoding="utf-8") as handle:
                      data = json.load(handle)
              except json.JSONDecodeError as error:
                  sys.exit(f"::error file={CONFIG_FILE}::invalid JSON — {error}")

              if not isinstance(data, dict):
                  sys.exit(f"::error file={CONFIG_FILE}::must contain a JSON object")

              # A typo'd key would otherwise be ignored in silence, leaving someone sure
              # they had configured something they had not.
              unknown = sorted(set(data) - set(FIELDS) - {"note"})
              if unknown:
                  sys.exit(
                      f"::error file={CONFIG_FILE}::unknown key(s) {', '.join(unknown)}. "
                      f"Valid keys: {', '.join(FIELDS)}, note"
                  )

              for field in FIELDS:
                  extra = data.get(field, [])
                  if not isinstance(extra, list):
                      sys.exit(f'::error file={CONFIG_FILE}::"{field}" must be an array')
                  for value in extra:
                      value = str(value).strip()
                      if value and value not in resolved[field]:
                          resolved[field].append(value)

              print(f"Merged {CONFIG_FILE} into the suite defaults.", file=sys.stderr)
          else:
              print(f"No {CONFIG_FILE}; using suite defaults.", file=sys.stderr)

          for field in FIELDS:
              print(f"{field}<<EOF_{field.upper()}")
              for value in resolved[field]:
                  print(value)
              print(f"EOF_{field.upper()}")
              print(f"  {field}: {resolved[field]}", file=sys.stderr)
          PY

      # Restored to the upstream action now that WordPress/plugin-check-action#579 is fixed
      # in v1.1.7 (PR #590), which removes the URL plugin from .wp-env.json, installs
      # plugin-check via wp-cli after boot, and verifies the environment came up — the same
      # workaround that was previously inlined here. Pinned to the tag (not @v1) so upstream
      # churn can't silently reach CI. Note: v1.1.8 still installs @wordpress/env unpinned;
      # the underlying wp-env URL-download bug is still unfixed upstream, but the action's
      # post-boot `wp cli info` check converts any silent startup failure into a loud one.
      - name: PCP
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          exclude-files: ${{ steps.pcp_config.outputs.exclude_files }}
          exclude-directories: ${{ steps.pcp_config.outputs.exclude_directories }}
          ignore-codes: ${{ steps.pcp_config.outputs.ignore_codes }}

  get_version:
    needs: pcp
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "Using manual input version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag run. Skipping."
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [pcp, get_version]
    if: ${{ needs.get_version.outputs.version && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

      - name: Install Production Dependencies
        run: |
          composer config repositories.gravityops-local --unset
          composer config minimum-stability stable
          composer config prefer-stable true
          CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
          composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup Vendor
        run: |
          find vendor -type f -name "*.sh" -delete
          rm -f vendor/trustedlogin/client/bin/build-sass
          rm -f vendor/bin/build-sass

      # See the pcp job: Strauss reads any github-oauth token via Composer's Factory; clear it
      # since prefixing needs no GitHub auth (gravityops/core is SSH/no-api, the rest are public).
      - name: Clear Composer github-oauth token
        run: composer config --global --unset github-oauth.github.com || true

      - name: Prefix namespaces (Strauss)
        run: |
          mkdir -p bin
          # Pin to a specific version known to ship a phar — Strauss releases have not always
          # included the phar asset, so tracking `latest` can break deploys. Bump deliberately.
          # curl -fSL https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar -o bin/strauss.phar
          curl -fSL https://github.com/BrianHenryIE/strauss/releases/download/0.29.1/strauss.phar -o bin/strauss.phar
          php bin/strauss.phar
          rm -rf bin
          composer dump-autoload

      - name: Create Zip
        if: ${{ inputs.deploy_to_freemius }}
        run: |
          mkdir -p build
          zip -r build/plugin.zip ${{ inputs.zip_files }}

      - name: Deploy to Freemius
        if: ${{ inputs.deploy_to_freemius }}
        id: freemius_deploy
        uses: eitan-brightleaf/freemius-deploy@main
        with:
          file_name: build/plugin.zip
          release_mode: 'released'
          add_contributor: 'true'
          fail_on_duplicate: '${{ inputs.fail_on_duplicate }}'
          overwrite: '${{ inputs.overwrite }}'
          download_premium: 'false'
          download_free: ${{ inputs.deploy_to_wp }}
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_ID: ${{ inputs.plugin_id }}

      - name: Prepare Plugin Directory for WP.org
        if: ${{ inputs.deploy_to_wp }}
        run: |
          mkdir plugin-dir
          if [ "${{ inputs.deploy_to_freemius }}" = "true" ]; then
            unzip ${{ steps.freemius_deploy.outputs.free_version }} -d plugin-dir
            if [ -d "plugin-dir/${{ inputs.plugin_slug }}" ]; then
              mv "plugin-dir/${{ inputs.plugin_slug }}"/* plugin-dir/
              rm -rf "plugin-dir/${{ inputs.plugin_slug }}"
            fi
          else
            # Local build logic using zip_files
            # We use a temp zip to respect the zip_files patterns and wildcards accurately.
            # build/ is only created by the Create Zip step, which is skipped on this path.
            mkdir -p build
            zip -r build/local-plugin.zip ${{ inputs.zip_files }}
            unzip build/local-plugin.zip -d plugin-dir
          fi

      - name: Modify Plugin Name for Lite version
        if: ${{ inputs.deploy_to_freemius && inputs.deploy_to_wp }}
        run: |
          # Find the main PHP file by searching for "Plugin Name:"
          MAIN_FILE=$(grep -l "Plugin Name:" plugin-dir/*.php | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            sed -i "s/Plugin Name: \(.*\)/Plugin Name: \1 - Lite/" "$MAIN_FILE"
            echo "Updated Plugin Name in $MAIN_FILE"
          fi

          # Append " - Lite" to the name in readme.txt
          if [ -f "plugin-dir/readme.txt" ]; then
            sed -i "1s/=== \(.*\) ===/=== \1 - Lite ===/" "plugin-dir/readme.txt"
            echo "Updated Plugin Name in readme.txt"
          fi

      - name: Install Subversion
        if: ${{ inputs.deploy_to_wp }}
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Deploy to WordPress.org SVN
        if: ${{ inputs.deploy_to_wp }}
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          BUILD_DIR: plugin-dir
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$BUILD_DIR" ]]; then
            echo "Build directory '$BUILD_DIR' not found." >&2
            exit 1
          fi

          SVN_URL="https://plugins.svn.wordpress.org/$SLUG"
          echo "Deploying version $VERSION to $SVN_URL"

          # Defensive cleanup in case any packaged files include SVN metadata.
          find "$BUILD_DIR" -type d -name ".svn" -prune -exec rm -rf {} +

          svn --version
          svn checkout "$SVN_URL" wporg

          rsync -rc --delete \
            --exclude ".git" \
            --exclude ".gitignore" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude "**/.git" \
            "$BUILD_DIR"/ wporg/trunk/

          cd wporg
          svn cleanup . || true
          svn update

          # Add all new files and directories recursively.
          svn add --force trunk --auto-props --parents

          # Remove missing files safely; using substring parsing avoids status-column bugs.
          while IFS= read -r missing_path; do
            [[ -z "$missing_path" ]] && continue
            svn rm --force "${missing_path}@"
          done < <(svn status | awk 'substr($0,1,1)=="!" {print substr($0,9)}')

          # Clear stale lock entries before committing.
          while IFS= read -r locked_path; do
            [[ -z "$locked_path" ]] && continue
            svn cleanup "${locked_path}" || true
          done < <(svn status | awk '(substr($0,1,1)=="L" || substr($0,3,1)=="L") {print substr($0,9)}')

          svn status

          if [[ -z "$(svn status)" ]]; then
            echo "No SVN changes to commit."
          else
            attempts=0
            until [ $attempts -ge 3 ]; do
              if svn commit --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache -m "Release $VERSION"; then
                echo "SVN trunk commit succeeded."
                break
              fi
              attempts=$((attempts + 1))
              if [ $attempts -ge 3 ]; then
                echo "SVN commit failed after 3 attempts." >&2
                exit 1
              fi
              echo "Commit failed, retrying in 20s... ($attempts/3)"
              sleep 20
              svn cleanup . || true
              svn update
            done
          fi

          TAG_URL="$SVN_URL/tags/$VERSION"
          if svn ls "$TAG_URL" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping tag creation."
          else
            svn copy "$SVN_URL/trunk" "$TAG_URL" \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache \
              -m "Tagging $VERSION"
            echo "Tagged $VERSION"
          fi

      - name: Notify Update Feed
        run: |
          VERSION="${{ needs.get_version.outputs.version }}"
          CHANGELOG=$(sed -n "/= $VERSION.*=/,/= /p" readme.txt | sed '1d;$d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '\n' ' ' | sed 's/"/\\"/g')
          curl -X POST ${{ secrets.UPDATE_FEED_URL }} \
            -H "X-API-Key: ${{ secrets.BLD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
            \"item_updated\": \"${{ inputs.update_feed_item_key }}\",
            \"version\": \"$VERSION\",
            \"changelog\": \"$CHANGELOG\"
          }"

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Sync Documentation
        run: |
          if [ -d "docs" ]; then
            echo "Processing documentation for ${{ inputs.plugin_slug }}..."
            # Convert Markdown to HTML fragments
            # Use gfm, --wrap=none and strip trailing spaces to avoid unintended line breaks
            find docs -name "*.md" -exec sh -c 'sed "s/[[:space:]]*$//" "$1" | pandoc -f gfm -t html --wrap=none -o "$1.html"' _ {} \;
            # Zip and POST
            zip -r docs.zip docs/
            curl -X POST "${{ inputs.docs_sync_url }}" \
              -H "x-api-key: ${{ secrets.BLD_API_KEY }}" \
              -F "plugin_slug=${{ inputs.plugin_slug }}" \
              -F "docs_zip=@docs.zip"
          else
            echo "No docs/ directory found. Skipping documentation sync."
          fi
