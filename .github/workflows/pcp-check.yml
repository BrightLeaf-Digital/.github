name: 'PCP Check and Deploy'

on:
  workflow_call:
    inputs:
      exclude_files:
        description: 'Files to exclude from the check'
        type: string
        required: false
        default: |
          .gitignore
          .wp-env.json
      ignore_codes:
        description: 'Ignore codes for the check'
        type: string
        required: false
        default: 'WordPress.DateTime.RestrictedFunctions.date_date'
      plugin_slug:
        description: 'The slug of the plugin on WordPress.org and Freemius'
        required: true
        type: string
      plugin_id:
        description: 'Freemius plugin ID'
        required: false
        type: string
      deploy_to_wp:
        description: 'Whether to deploy to WordPress.org or not'
        type: boolean
        required: true
      deploy_to_freemius:
        description: 'Whether to deploy to Freemius or not'
        type: boolean
        required: false
        default: true
      fail_on_duplicate:
        description: 'Whether to fail on duplicate plugin versions'
        type: boolean
        required: false
        default: true
      overwrite:
        description: 'Whether to overwrite existing plugin versions'
        type: boolean
        required: false
        default: false
      zip_files:
        description: 'Files and directories to include in the zip'
        type: string
        required: false
        default: 'includes vendor *.php *.txt composer.json'
      version:
        description: 'Version to deploy (optional, overrides tag)'
        required: false
        type: string
      update_feed_item_key:
        description: 'The key for the update feed item'
        required: true
        type: string
      docs_sync_url:
        description: 'URL to sync documentation'
        required: false
        type: string
        default: 'https://brightleafdigital.io/wp-json/bld/v1/sync-docs'

    secrets:
      BLD_API_KEY:
        required: true
      UPDATE_FEED_URL:
        required: true
      FREEMIUS_PUBLIC_KEY:
        required: false
      DEV_ID:
        required: false
      FREEMIUS_SECRET_KEY:
        required: false
      WP_SVN_USERNAME:
        required: false
      WP_SVN_PASSWORD:
        required: false
      SSH_PRIVATE_KEY_GRAVITYOPS_CORE:
        required: true

jobs:
  pcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

      - name: Install Production Dependencies
        run: |
          composer config repositories.gravityops-local --unset
          composer config minimum-stability stable
          composer config prefer-stable true
          CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
          composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup Vendor
        run: |
          find vendor -type f -name "*.sh" -delete
          rm -f vendor/trustedlogin/client/bin/build-sass
          rm -f vendor/bin/build-sass

      - name: Prefix namespaces (Strauss)
        run: composer run-script prefix-namespaces

      - name: PCP
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-files: ${{ inputs.exclude_files }}
          ignore-codes: ${{ inputs.ignore_codes }}

  get_version:
    needs: pcp
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag or input
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "Using manual input version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag run. Skipping."
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [pcp, get_version]
    if: ${{ needs.get_version.outputs.version && needs.get_version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GRAVITYOPS_CORE }}

      - name: Install Production Dependencies
        run: |
          composer config repositories.gravityops-local --unset
          composer config minimum-stability stable
          composer config prefer-stable true
          CORE_VERSION=$(jq -r '.require["gravityops/core"]' composer.json)
          composer require "gravityops/core:${CORE_VERSION}@stable" --update-no-dev --no-progress --optimize-autoloader --no-interaction

      - name: Cleanup Vendor
        run: |
          find vendor -type f -name "*.sh" -delete
          rm -f vendor/trustedlogin/client/bin/build-sass
          rm -f vendor/bin/build-sass

      - name: Prefix namespaces (Strauss)
        run: |
          mkdir -p bin
          # Use a specific version that is known to have a phar
          # curl -fSL https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar -o bin/strauss.phar
          curl -fSL https://github.com/BrianHenryIE/strauss/releases/download/0.27.0/strauss.phar -o bin/strauss.phar
          php bin/strauss.phar
          rm -rf bin
          composer dump-autoload

      - name: Create Zip
        if: ${{ inputs.deploy_to_freemius }}
        run: |
          mkdir -p build
          zip -r build/plugin.zip ${{ inputs.zip_files }}

      - name: Deploy to Freemius
        if: ${{ inputs.deploy_to_freemius }}
        id: freemius_deploy
        uses: eitan-brightleaf/freemius-deploy@main
        with:
          file_name: build/plugin.zip
          release_mode: 'released'
          add_contributor: 'true'
          fail_on_duplicate: '${{ inputs.fail_on_duplicate }}'
          overwrite: '${{ inputs.overwrite }}'
          download_premium: 'false'
          download_free: ${{ inputs.deploy_to_wp }}
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_ID: ${{ inputs.plugin_id }}

      - name: Prepare Plugin Directory for WP.org
        if: ${{ inputs.deploy_to_wp }}
        run: |
          mkdir plugin-dir
          if [ "${{ inputs.deploy_to_freemius }}" = "true" ]; then
            unzip ${{ steps.freemius_deploy.outputs.free_version }} -d plugin-dir
            if [ -d "plugin-dir/${{ inputs.plugin_slug }}" ]; then
              mv "plugin-dir/${{ inputs.plugin_slug }}"/* plugin-dir/
              rm -rf "plugin-dir/${{ inputs.plugin_slug }}"
            fi
          else
            # Local build logic using zip_files
            # We use a temp zip to respect the zip_files patterns and wildcards accurately
            zip -r build/local-plugin.zip ${{ inputs.zip_files }}
            unzip build/local-plugin.zip -d plugin-dir
          fi

      - name: Modify Plugin Name for Lite version
        if: ${{ inputs.deploy_to_freemius && inputs.deploy_to_wp }}
        run: |
          # Find the main PHP file by searching for "Plugin Name:"
          MAIN_FILE=$(grep -l "Plugin Name:" plugin-dir/*.php | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            sed -i "s/Plugin Name: \(.*\)/Plugin Name: \1 - Lite/" "$MAIN_FILE"
            echo "Updated Plugin Name in $MAIN_FILE"
          fi

          # Append " - Lite" to the name in readme.txt
          if [ -f "plugin-dir/readme.txt" ]; then
            sed -i "1s/=== \(.*\) ===/=== \1 - Lite ===/" "plugin-dir/readme.txt"
            echo "Updated Plugin Name in readme.txt"
          fi

      - name: Deploy to WordPress.org
        if: ${{ inputs.deploy_to_wp }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          BUILD_DIR: plugin-dir
          SLUG: ${{ inputs.plugin_slug }}
          VERSION: ${{ needs.get_version.outputs.version }}

      - name: Notify Update Feed
        run: |
          VERSION="${{ needs.get_version.outputs.version }}"
          CHANGELOG=$(sed -n "/= $VERSION.*=/,/= /p" readme.txt | sed '1d;$d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '\n' ' ' | sed 's/"/\\"/g')
          curl -X POST ${{ secrets.UPDATE_FEED_URL }} \
            -H "X-API-Key: ${{ secrets.BLD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
            \"item_updated\": \"${{ inputs.update_feed_item_key }}\",
            \"version\": \"$VERSION\",
            \"changelog\": \"$CHANGELOG\"
          }"

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Sync Documentation
        run: |
          if [ -d "docs" ]; then
            echo "Processing documentation for ${{ inputs.plugin_slug }}..."
            # Convert Markdown to HTML fragments
            # Use gfm, --wrap=none and strip trailing spaces to avoid unintended line breaks
            find docs -name "*.md" -exec sh -c 'sed "s/[[:space:]]*$//" "$1" | pandoc -f gfm -t html --wrap=none -o "$1.html"' _ {} \;
            # Zip and POST
            zip -r docs.zip docs/
            curl -X POST "${{ inputs.docs_sync_url }}" \
              -H "x-api-key: ${{ secrets.BLD_API_KEY }}" \
              -F "plugin_slug=${{ inputs.plugin_slug }}" \
              -F "docs_zip=@docs.zip"
          else
            echo "No docs/ directory found. Skipping documentation sync."
          fi
